name: CI Build

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore: # 文档更新不必触发 CI
      - "**.md"
      - "readme/**"
  push:
    branches:
      - main
    paths-ignore: # 文档更新不必触发 CI
      - "**.md"
      - "readme/**"

jobs:
  # 先计算符合语义化版本的 CI 预发布版本，再把结果传给复用构建流程。
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select CI version channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute CI version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_version.py \
            --channel "${{ steps.channel.outputs.channel }}" \
            --repo "${{ github.repository }}" \
            --workflow-file "ci.yaml" \
            --current-run-id "${{ github.run_id }}" \
            --current-run-number "${{ github.run_number }}"

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup UV for Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -ra

  # 复用既有打包流程，只替换传入的构建版本号。测试不过就不打包。
  build:
    needs: [prepare-version, test]
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.prepare-version.outputs.version }}

  publish-prerelease:
    name: Publish prerelease
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [prepare-version, test, build]
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download build artifact
        uses: actions/download-artifact@main
        with:
          name: AALC_${{ needs.prepare-version.outputs.version }}.7z
          path: release

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.version }}
          TARGET_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          releases_json="$(mktemp)"
          notes_json="$(mktemp)"
          notes_path="${RUNNER_TEMP}/aalc-release-notes.md"
          trap 'rm -f "$releases_json" "$notes_json"' EXIT

          gh api --paginate --slurp \
            "repos/${REPOSITORY}/releases?per_page=100" > "$releases_json"

          stable_tag="$(
            python - "$releases_json" <<'PY'
          import json
          import re
          import sys
          from datetime import datetime
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          releases = [release for page in pages for release in page]
          pattern = re.compile(r"^[Vv]?(\d+)\.(\d+)\.(\d+)$")
          candidates = []

          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              tag_name = release.get("tag_name", "")
              match = pattern.fullmatch(tag_name)
              published_at = release.get("published_at")
              if not match or not published_at:
                  continue
              published = datetime.fromisoformat(published_at.replace("Z", "+00:00"))
              candidates.append((tuple(int(part) for part in match.groups()), published, tag_name))

          if not candidates:
              raise SystemExit("No stable GitHub release matching Vx.y.z was found.")

          print(max(candidates, key=lambda item: (item[0], item[1]))[2])
          PY
          )"

          if [[ -z "$stable_tag" ]]; then
            echo "The stable release tag is empty." >&2
            exit 1
          fi

          gh api \
            --method POST \
            "repos/${REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${RELEASE_TAG}" \
            -f "target_commitish=${TARGET_COMMIT}" \
            -f "previous_tag_name=${stable_tag}" > "$notes_json"

          python - "$notes_json" "$notes_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          body = response.get("body")
          if not isinstance(body, str) or not body.strip():
              raise SystemExit("GitHub returned an empty release note body.")

          wrapped_body = (
              "此版本为自动构建的预发布版本，可能存在不稳定问题，仅供测试使用。\n\n"
              "<details>\n"
              "<summary>完整变更列表</summary>\n\n"
              f"{body.rstrip()}\n\n"
              "</details>\n"
          )
          Path(sys.argv[2]).write_text(wrapped_body, encoding="utf-8")
          PY

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare-version.outputs.version }}
          tag_name: ${{ needs.prepare-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ runner.temp }}/aalc-release-notes.md
          files: release/AALC_${{ needs.prepare-version.outputs.version }}.7z
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep latest beta prerelease
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prerelease_cleanup.py \
            --repo "${{ github.repository }}" \
            --current-tag "${{ needs.prepare-version.outputs.version }}"

      - name: Trigger MirrorChyan workflows
        if: steps.cleanup.outputs.retained == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          gh workflow run mirrorchyan_release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$VERSION"
          gh workflow run mirrorchyan_release_note.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$VERSION"
