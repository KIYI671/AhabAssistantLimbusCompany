config_version: 1781049600 # 配置文件版本号 (时间戳)
disable_mirror_rewards: true  # 开发者：放弃所有镜牢奖励，仅记录数据，默认关闭

# 游戏设置
game_title_name: LimbusCompany # 游戏窗口标题。
game_process_name: LimbusCompany.exe # 游戏进程名。

game_path: C:\Program Files (x86)\Steam\steamapps\common\Limbus 
  Company\LimbusCompany.exe                                                               # 游戏启动路径。

keep_after_completion: true  # 是否保持脚本结束后的操作
language_in_program: zh_cn # 程序语言
shutdown_hotkey: <ctrl>+q   # 关闭快捷键
pause_hotkey: <alt>+p   # 暂停快捷键
